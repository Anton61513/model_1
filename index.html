<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Авторизація — Управління заявками</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkBg: '#0b1120',
            cardBg: '#151d30',
            inputBg: '#1e293b',
            accentBlue: '#5457cd',
            accentHover: '#4345b2'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="w-full max-w-md bg-cardBg rounded-3xl p-6 sm:p-8 shadow-2xl relative border border-slate-800/80">
    
    <!-- Переключатели Язык / Тема -->
    <div class="flex justify-between items-center mb-6">
      <button type="button" onclick="toggleLanguage()" class="flex items-center space-x-2 bg-slate-800/80 hover:bg-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold text-slate-300 transition">
        <i class="fa-solid fa-globe text-indigo-400"></i>
        <span id="langLabel">UA</span>
      </button>

      <button type="button" onclick="toggleTheme()" class="w-9 h-9 flex items-center justify-center bg-slate-800/80 hover:bg-slate-700 rounded-xl text-slate-300 transition">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- Заголовок -->
    <div class="text-center mb-6">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-indigo-600 text-white shadow-lg shadow-indigo-600/30 mb-4">
        <i class="fa-solid fa-shield-halved text-3xl"></i>
      </div>
      <h2 id="authTitle" class="text-2xl font-bold tracking-tight text-white">Авторизація</h2>
      <p id="authSubtitle" class="text-xs text-slate-400 mt-1.5">Управління заявками та персоналом складу</p>
    </div>

    <!-- Блок сообщений об ошибках -->
    <div id="alertBox" class="hidden mb-4 p-3 rounded-xl text-xs font-medium border"></div>

    <!-- Вкладки: Вход / Регистрация -->
    <div class="flex bg-slate-900/90 p-1.5 rounded-2xl mb-6 border border-slate-800/50">
      <button type="button" id="tabLogin" onclick="switchAuthTab('login')" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-indigo-600/30 text-indigo-300 transition duration-200">
        Вхід
      </button>
      <button type="button" id="tabRegister" onclick="switchAuthTab('register')" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition duration-200">
        Реєстрація
      </button>
    </div>

    <!-- Форма -->
    <form id="authForm" onsubmit="handleAuthSubmit(event)" class="space-y-4">
      
      <!-- Выбор Роли -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">РОЛЬ</label>
        <select id="authRole" onchange="handleRoleOrTabChange()" class="w-full px-4 py-3 bg-inputBg border border-slate-700/60 rounded-xl text-sm font-medium text-white focus:outline-none focus:border-indigo-500 transition">
          <option value="admin">Адміністратор</option>
          <option value="manager">Менеджер</option>
          <option value="outsource">Виконавець (Аутсорс)</option>
        </select>
      </div>

      <!-- Выбор склада (для Админа) -->
      <div id="warehouseSelectBox">
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">ОБЕРІТЬ СВІЙ СКЛАД *</label>
        <select id="authWarehouse" class="w-full px-4 py-3 bg-inputBg border border-slate-700/60 rounded-xl text-sm font-medium text-white focus:outline-none focus:border-indigo-500 transition">
          <option value="oil">Oil склад (Код 221)</option>
          <option value="stasi">ЕРЦ / Стасі склад (Код 222)</option>
          <option value="kharkiv">Мурманська / Харків склад (Код 223)</option>
          <option value="dnipro">Дніпро склад (Код 224)</option>
        </select>
      </div>

      <!-- ФИО (только Регистрация) -->
      <div id="nameFieldsBox" class="hidden space-y-4">
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">ПРІЗВИЩЕ *</label>
          <input type="text" id="regLastName" placeholder="Шевченко" class="w-full px-4 py-3 bg-inputBg border border-slate-700/60 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">ІМ'Я *</label>
          <input type="text" id="regFirstName" placeholder="Тарас" class="w-full px-4 py-3 bg-inputBg border border-slate-700/60 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>

      <!-- Код доступа -->
      <div id="codeAccessBox">
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">КОД ДОСТУПУ *</label>
        <input type="password" id="authCode" placeholder="•••" class="w-full px-4 py-3 bg-inputBg border border-slate-700/60 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <!-- Телефон -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">НОМЕР ТЕЛЕФОНУ *</label>
        <input type="tel" id="authPhone" required placeholder="0000000003" class="w-full px-4 py-3 bg-inputBg border border-slate-700/60 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <!-- Пароль -->
      <div>
        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">ПАРОЛЬ *</label>
        <input type="password" id="authPassword" required placeholder="••••••" class="w-full px-4 py-3 bg-inputBg border border-slate-700/60 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition">
      </div>

      <!-- Кнопка отправки -->
      <button type="submit" id="btnSubmitAuth" class="w-full py-3.5 bg-accentBlue hover:bg-accentHover text-white font-bold rounded-xl text-sm shadow-lg shadow-indigo-600/30 transition duration-200 mt-2">
        Увійти в акаунт
      </button>
    </form>
  </div>

  <script>
    let currentMode = 'login';

    // Таблица соответствия кодов доступа для конкретных складов
    const WAREHOUSE_CODES = {
      oil: "221",
      stasi: "222",
      kharkiv: "223",
      dnipro: "224"
    };

    // Код доступа для Менеджера
    const MANAGER_CODE = "111";

    // Ссылки для перенаправления
    const REDIRECT_PAGES = {
      admin: "admin.html",
      manager: "manager.html",
      outsource: "outsource.html"
    };

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alertBox');
      box.classList.remove('hidden', 'bg-red-500/10', 'border-red-500/30', 'text-red-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      
      if (isError) {
        box.classList.add('bg-red-500/10', 'border-red-500/30', 'text-red-400');
      } else {
        box.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      }
      box.textContent = msg;
    }

    function switchAuthTab(tab) {
      currentMode = tab;
      const isLogin = tab === 'login';
      document.getElementById('alertBox').classList.add('hidden');
      
      document.getElementById('tabLogin').className = isLogin 
        ? "flex-1 py-2.5 text-xs font-bold rounded-xl bg-indigo-600/30 text-indigo-300 transition duration-200"
        : "flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition duration-200";

      document.getElementById('tabRegister').className = !isLogin 
        ? "flex-1 py-2.5 text-xs font-bold rounded-xl bg-indigo-600/30 text-indigo-300 transition duration-200"
        : "flex-1 py-2.5 text-xs font-bold rounded-xl text-slate-400 hover:text-white transition duration-200";

      document.getElementById('btnSubmitAuth').textContent = isLogin ? "Увійти в акаунт" : "Зареєструватися";
      handleRoleOrTabChange();
    }

    function handleRoleOrTabChange() {
      const role = document.getElementById('authRole').value;
      const isRegister = currentMode === 'register';

      document.getElementById('warehouseSelectBox').style.display = (role === 'admin') ? 'block' : 'none';
      document.getElementById('nameFieldsBox').classList.toggle('hidden', !isRegister);
      document.getElementById('codeAccessBox').style.display = (role === 'outsource') ? 'none' : 'block';
    }

    function handleAuthSubmit(e) {
      e.preventDefault();

      const role = document.getElementById('authRole').value;
      const phone = document.getElementById('authPhone').value.trim();
      const password = document.getElementById('authPassword').value.trim();
      const code = document.getElementById('authCode').value.trim();
      const warehouse = document.getElementById('authWarehouse').value;

      // 1. СТРОГАЯ ВАЛИДАЦИЯ КОДОВ ДОСТУПА
      if (role === 'manager') {
        if (!code) {
          showAlert("Введіть код доступу для Менеджера!");
          return;
        }
        if (code !== MANAGER_CODE) {
          showAlert("Невірний код доступу для Менеджера (потрібен код 111)!");
          return;
        }
      } else if (role === 'admin') {
        if (!code) {
          showAlert("Введіть код доступу склада!");
          return;
        }
        const expectedCode = WAREHOUSE_CODES[warehouse];
        if (code !== expectedCode) {
          showAlert(`Невірний код доступу! Для обраного складу потрібен код ${expectedCode}`);
          return;
        }
      }

      const users = JSON.parse(localStorage.getItem('app_users') || '[]');

      // 2. РЕГИСТРАЦИЯ
      if (currentMode === 'register') {
        const firstName = document.getElementById('regFirstName').value.trim();
        const lastName = document.getElementById('regLastName').value.trim();

        if (!firstName || !lastName) {
          showAlert("Введіть ім'я та прізвище!");
          return;
        }

        const existingUser = users.find(u => u.phone === phone);
        if (existingUser) {
          showAlert("Користувач з таким номером телефону вже існує!");
          return;
        }

        const newUser = {
          role,
          name: `${lastName} ${firstName}`,
          phone,
          password,
          warehouse: role === 'admin' ? warehouse : null
        };

        users.push(newUser);
        localStorage.setItem('app_users', JSON.stringify(users));
        localStorage.setItem('currentUser', JSON.stringify(newUser));

        showAlert("Реєстрація успішна! Перенаправлення...", false);

        setTimeout(() => {
          window.location.href = REDIRECT_PAGES[role];
        }, 1000);

      } 
      // 3. ВХОД В АККАУНТ
      else {
        const user = users.find(u => u.phone === phone);

        if (!user) {
          showAlert("Користувача з таким номером не знайдено. Спочатку зареєструйтесь!");
          return;
        }

        if (user.password !== password) {
          showAlert("Невірний пароль!");
          return;
        }

        if (user.role !== role) {
          showAlert(`Цей акаунт зареєстрований як: ${user.role}. Оберіть правильну роль!`);
          return;
        }

        localStorage.setItem('currentUser', JSON.stringify(user));
        showAlert("Успішний вхід! Перенаправлення...", false);

        setTimeout(() => {
          window.location.href = REDIRECT_PAGES[role];
        }, 1000);
      }
    }

    function toggleLanguage() {
      const langLabel = document.getElementById('langLabel');
      langLabel.textContent = langLabel.textContent === 'UA' ? 'EN' : 'UA';
    }

    function toggleTheme() {
      document.documentElement.classList.toggle('dark');
    }

    document.addEventListener('DOMContentLoaded', () => {
      handleRoleOrTabChange();
    });
  </script>
</body>
</html>
